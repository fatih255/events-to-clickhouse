include classpath("application.conf")

node-address {
  protocol = http
  host = elasticmq
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  events {
    defaultVisibilityTimeout = 30 seconds
    receiveMessageWait = 0 seconds
    # After 5 failed deliveries a message moves to the DLQ instead of looping forever.
    deadLettersQueue {
      name = "events-dlq"
      maxReceiveCount = 5
    }
  }
  events-dlq {}
}
