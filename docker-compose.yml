name: etc

x-app-env: &app-env
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: ${CLICKHOUSE_USER:-etc}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-etc_local_only}
  SQS_ENDPOINT: http://elasticmq:9324

services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8.33.6
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-etc}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-etc_local_only}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:18123:8123"
      - "127.0.0.1:18124:9000"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  elasticmq:
    image: softwaremill/elasticmq-native:1.6.14
    ports:
      - "127.0.0.1:18125:9324"
    volumes:
      - ./docker/elasticmq.conf:/opt/elasticmq.conf:ro

  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-etc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-etc_local_only}
      POSTGRES_DB: bench
    # Modest tuning so Postgres isn't measured with its tiny defaults.
    command: >
      postgres
      -c shared_buffers=2GB
      -c effective_cache_size=6GB
      -c work_mem=128MB
      -c maintenance_work_mem=1GB
      -c max_parallel_workers_per_gather=4
      -c max_wal_size=4GB
    shm_size: 2gb
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d bench"]
      interval: 2s
      timeout: 2s
      retries: 30

  collector:
    build: .
    command: ["node", "dist/src/collector/main.js"]
    environment:
      <<: *app-env
    ports:
      - "127.0.0.1:18120:18120"
    depends_on:
      elasticmq: { condition: service_started }

  writer:
    build: .
    command: ["node", "dist/src/writer/main.js"]
    environment:
      <<: *app-env
    depends_on:
      clickhouse: { condition: service_healthy }
      elasticmq: { condition: service_started }

  dashboard:
    build: .
    command: ["node", "dist/src/dashboard/main.js"]
    environment:
      <<: *app-env
      BENCH_RESULTS: /app/bench/results.json
    ports:
      - "127.0.0.1:18121:18121"
    volumes:
      - ./bench:/app/bench:ro
    depends_on:
      clickhouse: { condition: service_healthy }

  # One-shot: sends two weeks of synthetic popup traffic through the collector,
  # including some repeated requests, then exits.
  demo-traffic:
    build: .
    command: ["node", "dist/scripts/demo-traffic.js"]
    environment:
      COLLECTOR_URL: http://collector:18120
    depends_on:
      collector: { condition: service_started }
      writer: { condition: service_started }
    restart: "no"

volumes:
  clickhouse-data:
  postgres-data:
